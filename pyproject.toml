[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-xdp-client"
version = "0.1.0"
description = "Minimal RESP client for Redis (stdlib only), for testing XDP-based Redis processing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
redis-xdp-client = "redis_client:main"

[tool.setuptools]
py-modules = ["redis_client"]
